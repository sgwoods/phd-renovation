name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl python3-matplotlib

      - name: Cache Quicklisp
        uses: actions/cache@v4
        with:
          path: ~/quicklisp
          key: quicklisp-${{ runner.os }}

      - name: Install Quicklisp
        run: |
          if [ ! -f ~/quicklisp/setup.lisp ]; then
            curl -o /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
            sbcl --non-interactive \
              --load /tmp/quicklisp.lisp \
              --eval '(quicklisp-quickstart:install)' \
              --eval '(sb-ext:exit)'
          fi

      - name: Run FiveAM test suites
        run: sbcl --non-interactive --load "tests/run.lisp"

      - name: Validate thesis-result artifact pipeline
        run: bash tests/validate-artifacts.sh
